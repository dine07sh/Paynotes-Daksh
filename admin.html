<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayNotes Daksh — Admin</title><style>body{font:16px system-ui;background:#f4f8fc;color:#102a43;margin:0;padding:30px 16px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dce7f2;border-radius:16px;padding:22px;margin:18px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #dce7f2;border-radius:9px;margin:6px 0 14px;font:inherit;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:11px 15px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.green{background:#159957;color:#fff}.gray{background:#e8eef5}.red{background:#dc2626;color:#fff}.item{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #dce7f2;border-radius:10px;padding:13px;margin:9px 0}.actions{display:flex;gap:6px}#panel{display:none}pre{white-space:pre-wrap;background:#102a43;color:#dce7f2;padding:16px;border-radius:10px;overflow:auto}@media(max-width:600px){.row{grid-template-columns:1fr}.item{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap"><div id="login" class="card" style="max-width:360px;margin:80px auto;text-align:center"><h2>Admin login</h2><input id="password" type="password" placeholder="Password"><button class="green" style="width:100%" onclick="loginNow()">Login</button><p id="error" style="color:#dc2626;display:none">Wrong password</p></div><div id="panel"><h1>Product Manager</h1><p>Manage the academic packs shown on the student site.</p><div class="card"><h3>Add / edit product</h3><input type="hidden" id="edit" value="-1"><div class="row"><div><label>Class</label><select id="cls"><option>9</option><option>10</option><option>12</option></select></div><div><label>Icon</label><input id="icon" value="📘"></div></div><label>Tag</label><input id="tag" placeholder="Class 9 · Physics"><label>Name</label><input id="name" placeholder="Product name"><label>Description</label><textarea id="desc" rows="2"></textarea><label>Price ₹</label><input id="price" type="number"><button class="green" onclick="save()">Save product</button> <button class="gray" onclick="resetForm()">Clear</button></div><div class="card"><h3>Current products</h3><div id="list"></div></div><div class="card"><h3>Updated products array</h3><pre id="output"></pre><button class="green" onclick="copyCode()">Copy code</button></div></div></div><script>const ADMIN_PASSWORD='daksh2026';let products=[{cls:'9',icon:'⚡',tag:'Class 9 · Physics',name:'Physics Complete Study Pack',desc:'Concept notes, important questions, revision material and practice.',price:99},{cls:'9',icon:'📐',tag:'Class 9 · Maths',name:'Linear Polynomials Pack',desc:'Chapter notes, solved examples, practice questions and revision.',price:79},{cls:'9',icon:'📝',tag:'Class 9 · Exam',name:'PT-1 Preparation Bundle',desc:'Notes, practice papers and revision material for focused preparation.',price:149},{cls:'10',icon:'🔬',tag:'Class 10 · Science',name:'Science Revision Pack',desc:'Exam-oriented notes and chapter-wise revision resources.',price:129},{cls:'12',icon:'🚀',tag:'Class 12 · Physics',name:'Physics Board Revision Pack',desc:'Formula sheet, concepts, important questions and practice.',price:199},{cls:'12',icon:'🎯',tag:'Premium Bundle',name:'Complete Exam Bundle',desc:'Premium notes, practice and revision resources in one bundle.',price:299}];function loginNow(){if(password.value===ADMIN_PASSWORD){login.style.display='none';panel.style.display='block';render()}else error.style.display='block'}function render(){list.innerHTML=products.map((p,i)=>`<div class="item"><div><b>${p.icon} ${p.name}</b><br><small>${p.tag} · ₹${p.price}</small></div><div class="actions"><button class="gray" onclick="editProduct(${i})">Edit</button><button class="red" onclick="removeProduct(${i})">Delete</button></div></div>`).join('')||'<p>No products yet.</p>';output.textContent='const products = '+JSON.stringify(products,null,2)+';'}function save(){const p={cls:cls.value,icon:icon.value||'📘',tag:tag.value.trim(),name:name.value.trim(),desc:desc.value.trim(),price:Number(price.value)||0};if(!p.name||!p.price)return alert('Name and price are required');const i=Number(edit.value);if(i>=0)products[i]=p;else products.push(p);resetForm();render()}function editProduct(i){const p=products[i];edit.value=i;cls.value=p.cls;icon.value=p.icon;tag.value=p.tag;name.value=p.name;desc.value=p.desc;price.value=p.price;scrollTo(0,0)}function removeProduct(i){if(confirm('Delete this product?')){products.splice(i,1);render()}}function resetForm(){edit.value=-1;icon.value='📘';tag.value='';name.value='';desc.value='';price.value=''}function copyCode(){navigator.clipboard.writeText(output.textContent);alert('Code copied. Replace the products array in index.html and redeploy.')}password.onkeyup=e=>{if(e.key==='Enter')loginNow()}</script></body></html>
